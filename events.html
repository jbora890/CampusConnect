<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Search and filter CampusConnect events."><title>CampusConnect | Events</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><nav class="navbar container" aria-label="Main navigation">
<a class="logo" href="index.html"><span>CC</span> CampusConnect</a><button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
<ul class="nav-links" id="navLinks"><li><a href="index.html">Home</a></li><li><a class="active" href="events.html">Events</a></li><li><a href="about.html">About</a></li><li><a href="register.html">Register</a></li></ul>
</nav></header>
<main>
<section class="page-hero"><div class="container"><p class="eyebrow">EXPLORE CAMPUS LIFE</p><h1>Upcoming Events</h1><p>Find an activity that matches your interests and get involved.</p></div></section>
<section class="section container">
<div class="toolbar">
  <label class="search-box">🔍 <input id="searchInput" type="search" placeholder="Search events..." aria-label="Search events"></label>
  <select id="categoryFilter" aria-label="Filter by category"><option value="all">All Categories</option><option value="Sports">Sports</option><option value="Cultural">Cultural</option><option value="Technical">Technical</option><option value="Workshop">Workshop</option></select>
  <button class="btn btn-primary" id="showAddForm">+ Add Event</button>
</div>
<div id="addEventPanel" class="add-panel hidden">
<h2>Add a New Event</h2>
<form id="addEventForm" class="inline-form">
<input id="newTitle" required placeholder="Event title">
<select id="newCategory" required><option value="">Category</option><option>Sports</option><option>Cultural</option><option>Technical</option><option>Workshop</option></select>
<input id="newDate" required placeholder="Date e.g. Oct 05">
<input id="newLocation" required placeholder="Location">
<button class="btn btn-primary" type="submit">Add Event</button><button class="btn btn-outline" type="button" id="cancelAdd">Cancel</button>
</form></div>
<p id="resultCount" class="result-count"></p>
<div id="eventsContainer" class="card-grid"></div>
<p id="emptyState" class="empty-state hidden">No events match your search.</p>
</section>
</main>
<footer class="footer"><div class="container footer-bottom">© 2026 CampusConnect • Student Event Management Project</div></footer>
<script src="js/script.js"></script>
</body></html>
